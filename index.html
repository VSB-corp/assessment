<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263d3a;background:#faf5ed}*{box-sizing:border-box}body{margin:0}header{padding:20px max(24px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.03em;color:#285b54}.brand{display:grid;place-items:center;background:#397c70;color:white;border-radius:13px;width:42px;height:42px;font-size:24px}.topline{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#77918a}.wrap{max-width:960px;margin:auto;padding:24px 24px 60px}.progress{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#65827a;margin-bottom:10px}.bar{height:6px;border-radius:8px;background:#e5e9df;margin-bottom:30px}.bar span{display:block;height:100%;background:#e88d72;border-radius:8px;transition:width .2s}.card{background:#fffefa;border:1px solid #f0e7d9;border-radius:26px;box-shadow:0 16px 50px #62482c0d;overflow:hidden;display:grid;grid-template-columns:1fr 310px}.content{padding:42px}.art{background:#f6e6d8;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;color:#916c5a}.art svg{width:100%;max-width:230px}.art p{font-size:13px;line-height:1.6}.tag{display:inline-block;border-radius:30px;background:#e8f2ed;color:#397c70;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}h1,h2{font-family:Georgia,serif;line-height:1.2;letter-spacing:-.025em;color:#254b44}h1{font-size:38px;margin:20px 0 14px}h2{font-size:30px;margin:18px 0 12px}p{line-height:1.65;color:#687e76}label,.fieldtitle{font-size:14px;font-weight:750;display:block;margin:20px 0 8px}input[type=text],input[type=tel],select,textarea{width:100%;border:1px solid #d8e1d9;border-radius:12px;padding:14px;font:inherit;background:white;color:#263d3a}textarea{min-height:120px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f0b49f;outline-offset:2px}.choices{display:grid;gap:9px}.choice{display:flex;align-items:center;gap:12px;border:1px solid #e4e8e1;border-radius:12px;padding:12px;min-height:48px;cursor:pointer;margin:0;font-weight:500}.choice:has(input:checked){border-color:#438c7b;background:#edf7f1}.choice input{accent-color:#397c70;width:18px;height:18px}.buttons{display:flex;gap:12px;justify-content:space-between;margin-top:28px}button{border:0;border-radius:12px;padding:14px 22px;min-height:48px;font:inherit;font-weight:750;cursor:pointer;background:#357c6f;color:white}button.secondary{background:#edf1eb;color:#456d62}button:disabled{opacity:.6}.error{color:#a43a31;font-size:14px;font-weight:650}.muted{font-size:13px}.scale{font-size:14px;line-height:1.7}.review{border-top:1px solid #eee5d9;padding:12px 0}.review p{margin:4px 0;font-size:14px}.review button{padding:6px 12px;min-height:36px;font-size:12px}.footer{text-align:center;font-size:12px;color:#91a198;margin:26px}.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type-grid .choice{justify-content:center;padding:18px}.tip{background:#f9eee5;border-radius:14px;padding:12px 16px;font-size:13px;color:#866b5d}@media(max-width:700px){header{padding:16px 20px}.wrap{padding:12px 16px 40px}.card{display:flex;flex-direction:column-reverse}.content{padding:24px}.art{padding:15px;min-height:125px}.art svg{max-height:110px}.art p{display:none}h1{font-size:30px}h2{font-size:25px}.buttons button{flex:1}.type-grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><span class="brand">✳</span><span><span class="topline">Survei Pelayanan</span><br>RSU BUDHI ASIH</span></header><main class="wrap"><div class="progress"><span id="stage">SELAMAT DATANG</span><span id="progressText"></span></div><div class="bar"><span id="progressBar"></span></div><div class="card"><section class="content" id="content" aria-live="polite"></section><aside class="art" aria-hidden="true"><svg viewBox="0 0 240 210" fill="none"><circle cx="120" cy="101" r="91" fill="#F9F1E6"/><path d="M53 167h135" stroke="#D9B5A0" stroke-width="4" stroke-linecap="round"/><rect x="65" y="80" width="110" height="87" rx="12" fill="#FFFDF8"/><path d="M99 80V56a21 21 0 0142 0v24" fill="#8AB5A5"/><path d="M113 98h14v12h12v14h-12v12h-14v-12h-12v-14h12z" fill="#E7967D"/><text id="artIcon" x="120" y="159" text-anchor="middle" font-size="24">✦</text><circle cx="51" cy="74" r="9" fill="#EAB39A"/><path d="M187 47v22m-11-11h22" stroke="#7FAE9E" stroke-width="4" stroke-linecap="round"/><path d="M49 131c-13-13-6-29 2-19 7-10 15 6-2 19z" fill="#E8A18A"/></svg><p id="artCaption">Bersama menciptakan pelayanan yang lebih baik.</p></aside></div><div class="footer">RSU Budhi Asih Jakarta · Survei Pelayanan</div></main><script src="config.js"></script><script>
const questions={Nakes:['Area pelayanan saya bersih dan rapi.','Alat dan perlengkapan layanan siap pakai sebelum melayani.','Seragam dan tanda pengenal saya rapi.','Saya melayani sesuai SOP dan standar keselamatan pasien.','Saya memulai pelayanan sesuai jadwal atau janji.','Saya mencatat dan menyerahterimakan informasi pasien dengan akurat.','Saya menjelaskan alur pelayanan dan perkiraan waktu tunggu.','Saya cepat menanggapi pasien atau keluarga yang meminta bantuan.','Saya segera memberi tahu jika ada perubahan jadwal atau tindakan.','Saya menjaga privasi dan kerahasiaan data pasien.','Saya menjelaskan diagnosis, obat, atau tindakan dengan bahasa yang mudah dipahami.','Saya memperkenalkan diri sebelum melayani pasien.','Saya mendengarkan keluhan pasien dan keluarga dengan sabar.','Saya mendahulukan lansia, ibu hamil, anak, dan penyandang disabilitas.','Saya menyesuaikan cara pelayanan dengan kondisi dan kebutuhan pasien.'], 'Non-Nakes':['Area kerja saya bersih dan rapi.','Seragam dan tanda pengenal saya rapi.','Papan petunjuk, antrean, dan perlengkapan di area saya tertata dan berfungsi.','Saya hadir dan bekerja sesuai jadwal.','Saya menjalankan tugas sesuai SOP bagian saya.','Saya berkoordinasi dengan rekan agar layanan berjalan lancar.','Saya mengarahkan pasien atau pengunjung ke lokasi tujuan.','Saya cepat membantu saat diminta.','Saya segera meneruskan keluhan pasien ke petugas terkait.','Saya menjaga keamanan dan ketertiban lingkungan rumah sakit.','Saya tetap sopan dan tenang menghadapi pengunjung yang marah atau bingung.','Saya memberi informasi yang benar sesuai kewenangan saya.','Saya menyapa pasien dan pengunjung dengan ramah.','Saya membantu lansia, ibu hamil, anak, dan penyandang disabilitas.','Saya sabar menjawab pertanyaan yang berulang.']};
const units=['IGD','Rawat Jalan / Poli','Rawat Inap','ICU / HCU','Kamar Operasi','Farmasi','Laboratorium','Radiologi','Pendaftaran / Rekam Medis','Keamanan / Kebersihan / Parkir','Lainnya'];const labels={h:['Tidak Penting','Kurang Penting','Biasa Saja (cukup)','Penting','Sangat Penting'],k:['Tidak Pernah','Sangat Jarang','Jarang','Sering','Selalu']};
const key='budhiasih-assessment-v1';let state;try{state=JSON.parse(sessionStorage.getItem(key))}catch(e){} if(!state) state={id:crypto.randomUUID(),type:'',unit:'',other:'',name:'',phone:'',feedback:'',answers:Array.from({length:15},()=>({})),step:0};
const el=document.getElementById('content');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{sessionStorage.setItem(key,JSON.stringify(state))}catch(e){}}function nav(back=true,next='Lanjut →'){return `<p class="error" id="error" role="alert"></p><div class="buttons">${back?'<button class="secondary" type="button" onclick="goBack()">← Kembali</button>':'<span></span>'}<button type="submit">${next}</button></div>`}function options(name,arr,value){return arr.map((x,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i+1}" ${value===i+1?'checked':''}> <span>${i+1}. ${x}</span></label>`).join('')}
function render(){let s=state.step;const icons={Nakes:['🧹','🩺','🪪','📋','🕒','📝','💬','🤝','📅','🔒','💊','👋','👂','♿','💗'],'Non-Nakes':['🧹','🪪','🪧','🕒','📋','🤝','🧭','🙌','📣','🛡️','💬','ℹ️','👋','♿','💗']};document.getElementById('artIcon').textContent=(s>=3&&s<=17&&icons[state.type])?icons[state.type][s-3]:'✦';document.getElementById('stage').textContent=s===0?'SELAMAT DATANG':s===1?'A. DATA RESPONDEN':s===2?'PETUNJUK PENGISIAN':s<=17?`B. PERTANYAAN ${s-2} / 15`:s===18?'C. SARAN PERBAIKAN':s===19?'TINJAU JAWABAN':'SELESAI';document.getElementById('progressText').textContent=s>2&&s<=17?`${s-2} dari 15`:'';document.getElementById('progressBar').style.width=(Math.min(s,20)/20*100)+'%';let h='';
if(s===0)h=`<span class="tag">Suara Anda berarti</span><h1>Pelayanan yang lebih baik, dimulai dari kita.</h1><p>Terima kasih atas kesediaan Bapak/Ibu mengisi survei ini. Pendapat Bapak/Ibu sangat berharga bagi kami untuk meningkatkan kualitas pelayanan rumah sakit.</p><p class="tip">Jawaban bersifat rahasia dan digunakan untuk perbaikan pelayanan. Tidak ada jawaban yang benar atau salah.</p><div class="fieldtitle">Pilih jenis responden</div><div class="type-grid">${['Nakes','Non-Nakes'].map(t=>`<label class="choice"><input type="radio" name="type" value="${t}" ${state.type===t?'checked':''}> ${t}</label>`).join('')}</div>${nav(false,'Mulai survei →')}`;
else if(s===1)h=`<span class="tag">A. Data Responden</span><h2>Mari berkenalan.</h2><p>Lengkapi data diri Bapak/Ibu terlebih dahulu.</p><label for="unit">Unit Layanan *</label><select id="unit" name="unit"><option value="">Pilih unit layanan</option>${units.map(u=>`<option ${state.unit===u?'selected':''}>${u}</option>`).join('')}</select><div id="otherWrap" ${state.unit==='Lainnya'?'':'hidden'}><label for="other">Unit lainnya *</label><input id="other" name="other" type="text" value="${esc(state.other)}"></div><label for="name">Nama Lengkap *</label><input id="name" name="name" type="text" autocomplete="name" value="${esc(state.name)}"><label for="phone">No. Telp WhatsApp *</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="${esc(state.phone)}">${nav()}`;
else if(s===2)h=`<span class="tag">Petunjuk pengisian</span><h2>Sebelum mulai, yuk simak.</h2><p>Setiap pernyataan ditanyakan dua kali. Pilih satu angka (1 sampai 5) untuk setiap pertanyaan.</p><div class="fieldtitle">HARAPAN</div><p>Seberapa penting hal ini menurut Bapak/Ibu?</p><div class="scale">1. Tidak Penting — Hal ini tidak diperlukan sama sekali<br>2. Kurang Penting — Boleh ada, tetapi tidak terlalu dibutuhkan<br>3. Biasa Saja (cukup) — Perlu ada, tetapi bukan yang paling utama<br>4. Penting — Harus ada karena sangat membantu pekerjaan<br>5. Sangat Penting — Wajib ada, pekerjaan tidak bisa berjalan baik tanpa ini</div><div class="fieldtitle">KENYATAAN (persepsi)</div><p>Seberapa sering hal ini benar-benar Bapak/Ibu jalankan sehari-hari?</p><div class="scale">1. Tidak Pernah — Tidak pernah dilakukan sama sekali<br>2. Sangat Jarang — Hampir tidak pernah, hanya sesekali dalam waktu lama<br>3. Jarang — Kadang dilakukan, tetapi lebih sering tidak<br>4. Sering — Biasanya dilakukan, hanya sesekali terlewat<br>5. Selalu — Dilakukan setiap hari tanpa terkecuali</div><p class="tip">Contoh: bila kebersihan sangat penting, pilih Harapan 5. Bila sering dilakukan, pilih Kenyataan 4.</p>${nav()}`;
else if(s<=17){let i=s-3;h=`<span class="tag">Pernyataan ${i+1} dari 15 · ${state.type}</span><h2>${questions[state.type][i]}</h2><p>Silakan pilih satu jawaban untuk masing-masing bagian.</p><fieldset style="border:0;padding:0;margin:0"><legend class="fieldtitle">Harapan: seberapa penting hal ini menurut Bapak/Ibu? *</legend><div class="choices">${options('h',labels.h,state.answers[i].h)}</div></fieldset><fieldset style="border:0;padding:0;margin:0"><legend class="fieldtitle">Kenyataan: seberapa sering hal ini benar-benar Bapak/Ibu jalankan sehari-hari? *</legend><div class="choices">${options('k',labels.k,state.answers[i].k)}</div></fieldset>${nav()}`}
else if(s===18)h=`<span class="tag">C. Saran perbaikan</span><h2>Pendapat Anda berarti.</h2><label for="feedback">Apa satu hal yang paling perlu diperbaiki agar pelayanan RSU Budhi Asih Jakarta menjadi lebih baik? *</label><textarea name="feedback" id="feedback">${esc(state.feedback)}</textarea>${nav()}`;
else if(s===19)h=`<span class="tag">Hampir selesai</span><h2>Periksa jawaban Anda.</h2><div class="review"><p>${esc(state.type)} · ${esc(state.name)}<br>${esc(state.unit==='Lainnya'?state.other:state.unit)} · ${esc(state.phone)}</p><button type="button" class="secondary" onclick="jump(1)">Ubah data</button></div>${questions[state.type].map((q,i)=>`<div class="review"><p><strong>${i+1}. ${q}</strong><br>Harapan: ${state.answers[i].h} · Kenyataan: ${state.answers[i].k}</p><button class="secondary" type="button" onclick="jump(${i+3})">Ubah</button></div>`).join('')}<div class="review"><p><strong>Saran:</strong> ${esc(state.feedback)}</p><button class="secondary" type="button" onclick="jump(18)">Ubah</button></div>${nav(true,'Kirim jawaban →')}`;
else h=`<span class="tag">Selesai</span><h1>Terima kasih sudah berbagi.</h1><p>Jawaban Bapak/Ibu telah tersimpan dan akan membantu meningkatkan pelayanan rumah sakit.</p><button type="button" onclick="startOver()">Isi respons baru</button>`;
el.innerHTML=`<form id="form">${h}</form>`;let unit=document.getElementById('unit');if(unit)unit.onchange=()=>document.getElementById('otherWrap').hidden=unit.value!=='Lainnya';document.getElementById('form').onsubmit=submit;window.scrollTo(0,0)}
function submit(e){e.preventDefault();let s=state.step,f=new FormData(e.target),error=document.getElementById('error');if(s===0){let t=f.get('type');if(!t){error.textContent='Pilih jenis responden terlebih dahulu.';return}if(state.type&&state.type!==t)state.answers=Array.from({length:15},()=>({}));state.type=t}else if(s===1){for(let x of ['unit','other','name','phone'])state[x]=(f.get(x)||'').trim();if(!state.unit||!state.name||!state.phone||(state.unit==='Lainnya'&&!state.other)){error.textContent='Mohon lengkapi semua data responden.';return}}else if(s>=3&&s<=17){let h=Number(f.get('h')),k=Number(f.get('k'));if(!h||!k){error.textContent='Pilih jawaban Harapan dan Kenyataan terlebih dahulu.';return}state.answers[s-3]={h,k}}else if(s===18){state.feedback=(f.get('feedback')||'').trim();if(!state.feedback){error.textContent='Mohon isi saran perbaikan.';return}}else if(s===19){let btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Mengirim…';const send=async()=>{try{if(!window.APP_CONFIG?.url||!window.APP_CONFIG?.key)throw Error('Aplikasi belum dikonfigurasi.');const response=await fetch(window.APP_CONFIG.url+'/rest/v1/rpc/submit_assessment',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.APP_CONFIG.key,'Authorization':'Bearer '+window.APP_CONFIG.key},body:JSON.stringify({payload:{id:state.id,type:state.type,unit:state.unit,other:state.other,name:state.name,phone:state.phone,feedback:state.feedback,answers:state.answers}})});if(!response.ok)throw Error('Pengiriman gagal');sessionStorage.removeItem(key);state.step=20;render()}catch(err){error.textContent='Jawaban belum dapat dipastikan tersimpan. Periksa koneksi dan coba lagi; jawaban Anda tetap tersedia.';btn.disabled=false;btn.textContent='Coba kirim lagi →'}};send();return}state.step++;save();render()}
function goBack(){state.step=Math.max(0,state.step-1);save();render()}function jump(s){state.step=s;save();render()}function startOver(){sessionStorage.removeItem(key);location.reload()}render();
</script></body></html>

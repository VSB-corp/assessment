<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Assessment RSU Budhi Asih</title><style>body{font:16px system-ui;background:#faf5ed;color:#263d3a;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:24px;margin:18px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b8ccc3;border-radius:8px}button{background:#357c6f;color:white;cursor:pointer}label{display:block;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #ddd;text-align:left;padding:10px} .scroll{overflow:auto}.error{color:#a43a31} .actions{display:flex;flex-wrap:wrap;gap:10px} [hidden]{display:none!important}</style></head><body><main><h1>Admin assessment</h1><p>RSU Budhi Asih · Hasil survei</p><p id="message" class="error" role="status"></p><section id="login"><h2>Masuk admin</h2><form id="loginForm"><label>Email<br><input name="email" type="email" required autocomplete="username"></label><label>Kata sandi<br><input name="password" type="password" required autocomplete="current-password"></label><button>Masuk</button></form></section><section id="dashboard" hidden><div class="actions"><button id="refresh">Muat ulang</button><button id="export">Ekspor Excel</button><button id="toggle"></button><button id="logout">Keluar</button></div><label>Jenis responden <select id="filter"><option value="">Semua</option><option>Nakes</option><option>Non-Nakes</option></select></label><label>Cari nama atau unit <input id="search" type="search"></label><p id="count"></p><div class="scroll"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Nama</th><th>Unit</th><th>WhatsApp</th><th>Saran</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script src="https:
